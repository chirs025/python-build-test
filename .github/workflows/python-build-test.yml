name: Python Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test on Python 3.12
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install build and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build pytest

      - name: Build source distribution and wheel
        run: python -m build

      - name: Install built wheel
        run: python -m pip install dist/*.whl

      - name: Run unit tests
        run: python -m pytest -v tests --junitxml=test-results.xml

      - name: Upload build and test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-build-and-test-artifacts
          path: |
            dist/
            test-results.xml
          if-no-files-found: warn
